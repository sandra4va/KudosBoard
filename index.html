    /* Global Styles & Print Optimization */
    body {
      margin: 0;

    /* Sticky note paper curls */
    .paper-curl {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 10px 15px -3px rgba(0, 0, 0, 0.08);

    }

      content: '';
      position: absolute;
      bottom: 2px;
      right: 2px;

      height: 16px;

      left: 50%;

    function loadDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (!raw) {
          localStorage.setItem(DB_KEY, JSON.stringify(INITIAL_SEED));
          return INITIAL_SEED;
        }
        return JSON.parse(raw);
      } catch (e) {
        return INITIAL_SEED;
      }
    }

    function saveDB(db) {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
      } catch (e) {}
    }

    // Realtime Broadcast Channel & Window Storage Sync
    let realTimeBus = null;
    if (typeof window !== 'undefined' && 'BroadcastChannel' in window) {
      realTimeBus = new BroadcastChannel('kudosboard_channel');
    }

    function broadcastEvent(event) {
      const payload = { ...event, timestamp: Date.now() };
      if (realTimeBus) {
        try { realTimeBus.postMessage(payload); } catch (e) {}
      }
      try {
        localStorage.setItem('kudosboard_sync_tick', JSON.stringify(payload));
      } catch (e) {}
      window.dispatchEvent(new CustomEvent('kudos_realtime', { detail: payload }));
    }

    function App() {
      // Routing state: 'board' or 'dashboard'
      const [currentRoute, setCurrentRoute] = useState('board');
      const [activeSlug, setActiveSlug] = useState('happy-birthday-maya');
      
      // Board state
      const [db, setDb] = useState(() => loadDB());
      const [creatorSession, setSession] = useState(() => getCreatorSession());
      const [layoutMode, setLayoutMode] = useState('grid'); // 'grid' | 'timeline' | 'slideshow'
      
      // Modals
      const [showAddModal, setShowAddModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showNewBoardModal, setShowNewBoardModal] = useState(false);
      const [showSupabaseModal, setShowSupabaseModal] = useState(false);

      // Remote Supabase Client (Optional Live PostgreSQL connection)
      const [supabaseClient, setSupabaseClient] = useState(() => {
        try {
          const saved = localStorage.getItem('kudosboard_supabase_config');
          const cfg = saved ? JSON.parse(saved) : (window.KUDOSBOARD_ENV || {});
          if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) {
            return window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
          }
        } catch (e) {}
        return null;
      });
      
      // Live Presence Counter
      const [onlineCount, setOnlineCount] = useState(3);

      // Toast Notification
      const [toast, setToast] = useState(null);

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Handle URL Hash Navigation
      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash;
          if (hash.startsWith('#/dashboard')) {
            setCurrentRoute('dashboard');
          } else if (hash.startsWith('#/board/')) {
            const slug = hash.replace('#/board/', '');
            if (slug) {
              setActiveSlug(slug);
              setCurrentRoute('board');
            }
          }
        };

        window.addEventListener('hashchange', handleHashChange);
        handleHashChange();
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      // Realtime listener
      useEffect(() => {
        const handleRealtime = (payload) => {
          setDb(loadDB());
          if (payload.type === 'POST_INSERT') {
            showNotification(`${payload.payload.author_name} just added a new note! ✨`);
          } else if (payload.type === 'BOARD_UPDATE') {
            showNotification(`Board settings updated! 🎨`);
          }
        };

        const onCustomEvent = (e) => handleRealtime(e.detail);
        window.addEventListener('kudos_realtime', onCustomEvent);

        if (realTimeBus) {
          realTimeBus.onmessage = (e) => handleRealtime(e.data);
        }

        const onStorage = (e) => {
          if (e.key === 'kudosboard_sync_tick' && e.newValue) {
            try {
              handleRealtime(JSON.parse(e.newValue));
            } catch (err) {}
          }
        };
        window.addEventListener('storage', onStorage);

        // Presence heartbeat simulation
        const presenceTimer = setInterval(() => {
          // slight realistic jitter
          setOnlineCount(prev => Math.max(2, Math.min(8, prev + (Math.random() > 0.5 ? 1 : -1))));
        }, 8000);

        return () => {
          window.removeEventListener('kudos_realtime', onCustomEvent);
          window.removeEventListener('storage', onStorage);
          clearInterval(presenceTimer);
        };
      }, []);

      // Current active board
      const currentBoard = useMemo(() => {
        return db.boards.find(b => b.share_slug === activeSlug) || db.boards[0];
      }, [db.boards, activeSlug]);

      // Check if current user is Creator of active board
      const isCreator = useMemo(() => {
        if (!creatorSession || !currentBoard) return false;
        return creatorSession.creator_id === currentBoard.creator_id;
      }, [creatorSession, currentBoard]);

      // Posts with aggregated reactions and replies
      const boardPosts = useMemo(() => {
        if (!currentBoard) return [];
        const fp = getGuestFingerprint();
        const posts = db.kudos_posts.filter(p => p.board_id === currentBoard.id);
        const reactions = db.kudos_reactions.filter(r => r.board_id === currentBoard.id);
        const replies = db.kudos_replies.filter(rep => rep.board_id === currentBoard.id);

        return posts.map(post => {
          const postRx = reactions.filter(r => r.post_id === post.id);
          const postReps = replies.filter(rep => rep.post_id === post.id);

          const counts = { '❤️': 0, '🎉': 0, '👏': 0, '😂': 0, '🙌': 0, '🔥': 0 };
          const userReacted = { '❤️': false, '🎉': false, '👏': false, '😂': false, '🙌': false, '🔥': false };

          postRx.forEach(r => {
            if (counts[r.emoji] !== undefined) counts[r.emoji]++;
            if (r.guest_fingerprint === fp) userReacted[r.emoji] = true;
          });

          return {
            ...post,
            reactions: counts,
            user_reacted: userReacted,
            replies: postReps.sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
          };
        }).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }, [db, currentBoard]);

      // Theme configuration
      const themeConfig = THEMES[currentBoard?.theme] || THEMES.corkboard;

      // Creator Mutations
      const handleUpdateBoard = (updates) => {
        if (!isCreator) {
          alert('403 Forbidden: Only the board creator can modify board settings.');
          return;
        }
        const updated = { ...currentBoard, ...updates, updated_at: new Date().toISOString() };
        const newBoards = db.boards.map(b => b.id === currentBoard.id ? updated : b);
        const newDb = { ...db, boards: newBoards };
        saveDB(newDb);
        setDb(newDb);
        broadcastEvent({ type: 'BOARD_UPDATE', payload: updated, board_id: currentBoard.id });
      };

      const handleDeletePost = (postId) => {
        if (!isCreator) {
          alert('403 Forbidden: Only the board creator can delete posts.');
          return;
        }
        if (!confirm('Are you sure you want to remove this post?')) return;
        const newPosts = db.kudos_posts.filter(p => p.id !== postId);
        const newRx = db.kudos_reactions.filter(r => r.post_id !== postId);
        const newReps = db.kudos_replies.filter(r => r.post_id !== postId);
        const newDb = { ...db, kudos_posts: newPosts, kudos_reactions: newRx, kudos_replies: newReps };
        saveDB(newDb);
        setDb(newDb);
        broadcastEvent({ type: 'POST_DELETE', payload: { id: postId }, board_id: currentBoard.id });
      };

      const handleDeleteReply = (replyId) => {
        if (!isCreator) {
          alert('403 Forbidden: Only the board creator can delete replies.');
          return;
        }
        const newReps = db.kudos_replies.filter(r => r.id !== replyId);
        const newDb = { ...db, kudos_replies: newReps };
        saveDB(newDb);
        setDb(newDb);
        broadcastEvent({ type: 'REPLY_DELETE', payload: { id: replyId }, board_id: currentBoard.id });
      };

      // Guest / Creator Actions
      const handleToggleReaction = (postId, emoji) => {
        const fp = getGuestFingerprint();
        const existingIdx = db.kudos_reactions.findIndex(
          r => r.post_id === postId && r.emoji === emoji && r.guest_fingerprint === fp
        );
        let newRx = [...db.kudos_reactions];
        let action = '';
        if (existingIdx !== -1) {
          newRx.splice(existingIdx, 1);
          action = 'removed';
        } else {
          newRx.push({
            id: 'r-' + Math.random().toString(36).substring(2, 9),
            post_id: postId,
            board_id: currentBoard.id,
            emoji,
            guest_fingerprint: fp,
            created_at: new Date().toISOString()
          });
          action = 'added';
        }
        const newDb = { ...db, kudos_reactions: newRx };
        saveDB(newDb);
        setDb(newDb);
        broadcastEvent({
          type: 'REACTION_TOGGLE',
          payload: { post_id: postId, emoji, action },
          board_id: currentBoard.id
        });
      };

      const handleAddReply = (postId, replyText, authorName) => {
        if (!replyText || !replyText.trim()) return;
        if (currentBoard.is_locked) {
          alert('This board is locked.');
          return;
        }
        const newReply = {
          id: 'rep-' + Math.random().toString(36).substring(2, 9),
          post_id: postId,
          board_id: currentBoard.id,
          author_name: isCreator ? (authorName || 'Board Creator 👑') : (authorName || 'Guest'),
          is_creator: isCreator,
          reply_text: replyText.trim(),
          created_at: new Date().toISOString()
        };
        const newDb = { ...db, kudos_replies: [...db.kudos_replies, newReply] };
        saveDB(newDb);
        setDb(newDb);
        broadcastEvent({ type: 'REPLY_INSERT', payload: newReply, board_id: currentBoard.id });
      };

      const handleAddPost = (postData) => {
        if (currentBoard.is_locked) {
          alert('Submissions are locked for this board.');
          return;
        }
        const newPost = {
          id: 'p-' + Math.random().toString(36).substring(2, 9),
          board_id: currentBoard.id,
          author_name: postData.is_anonymous ? 'Anonymous' : (postData.author_name || 'Friendly Guest'),
          is_anonymous: !!postData.is_anonymous,
          message: postData.message.trim(),
          color_id: postData.color_id || 'lemon',
          accent_emoji: postData.accent_emoji || '🎉',
          sticker_id: postData.sticker_id || 'none',
          photo_url: postData.photo_url || null,
          created_at: new Date().toISOString()
        };
        const newDb = { ...db, kudos_posts: [newPost, ...db.kudos_posts] };
        saveDB(newDb);
        setDb(newDb);
        broadcastEvent({ type: 'POST_INSERT', payload: newPost, board_id: currentBoard.id });
        setShowAddModal(false);

        // Confetti burst on post
        if (window.confetti) {
          window.confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
        }
      };

      // Export handlers
      const handleExportJPG = async () => {
        const boardEl = document.getElementById('kudos-board-canvas');
        if (!boardEl || !window.html2canvas) {
          alert('Canvas export engine initializing...');
          return;
        }
        document.body.classList.add('export-mode-active');
        try {
          const canvas = await window.html2canvas(boardEl, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: null
          });
          const link = document.createElement('a');
          link.download = `${currentBoard.share_slug}-keepsake.jpg`;
          link.href = canvas.toDataURL('image/jpeg', 0.95);
          link.click();
          showNotification('JPG Keepsake downloaded successfully! 📸');
        } catch (e) {
          alert('Failed to export JPG: ' + e.message);
        } finally {
          document.body.classList.remove('export-mode-active');
        }
      };

      const handleExportPDF = () => {
        if (!window.jspdf) {
          alert('PDF engine initializing...');
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 20;

        // Cover Page
        doc.setFillColor(30, 41, 59);
        doc.rect(0, 0, pageWidth, pageHeight, 'F');
        doc.setDrawColor(251, 191, 36);
        doc.setLineWidth(1.5);
        doc.rect(margin - 5, margin - 5, pageWidth - (margin - 5) * 2, pageHeight - (margin - 5) * 2);

        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(24);
        const cleanTitle = (currentBoard.title || 'Celebration Kudos Board').replace(/[^\x00-\x7F]/g, '');
        const titleLines = doc.splitTextToSize(cleanTitle, pageWidth - margin * 2 - 10);
        doc.text(titleLines, pageWidth / 2, 85, { align: 'center' });

        doc.setTextColor(203, 213, 225);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(13);
        const cleanSub = (currentBoard.subtitle || 'A digital keepsake of warm messages & congratulations').replace(/[^\x00-\x7F]/g, '');
        const subLines = doc.splitTextToSize(cleanSub, pageWidth - margin * 2 - 20);

        doc.setTextColor(251, 191, 36);
        doc.setFontSize(11);
        doc.text(`Total Messages: ${boardPosts.length}  •  Created on KudosBoard`, pageWidth / 2, 150, { align: 'center' });
        doc.text(`Exported: ${new Date().toLocaleDateString()}`, pageWidth / 2, 160, { align: 'center' });

        // Messages page
        let currentY = margin + 10;
        doc.addPage();
        doc.setFillColor(248, 250, 252);
        doc.rect(0, 0, pageWidth, pageHeight, 'F');

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.setTextColor(15, 23, 42);
        doc.text('Messages & Well Wishes', margin, currentY);
        currentY += 15;

          if (currentY + cardHeight > pageHeight - margin) {
            doc.addPage();
            doc.setFillColor(248, 250, 252);
            doc.rect(0, 0, pageWidth, pageHeight, 'F');
            currentY = margin + 10;
          }

          doc.setFillColor(255, 255, 255);
          doc.setDrawColor(226, 232, 240);
          doc.setLineWidth(0.5);
          doc.roundedRect(margin, currentY, pageWidth - margin * 2, cardHeight, 3, 3, 'FD');

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(10);
          doc.setTextColor(30, 41, 59);
          const authorText = (post.is_anonymous ? 'Anonymous' : (post.author_name || 'Guest')).replace(/[^\x00-\x7F]/g, '');

          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text(new Date(post.created_at).toLocaleDateString(), pageWidth - margin - 25, currentY + 9);

          doc.setTextColor(51, 65, 85);

          doc.text(msgLines.slice(0, 3), margin + 6, currentY + 18);

          currentY += cardHeight + 6;
        });

      const [photoUrl, setPhotoUrl] = useState('');
      const [filePreview, setFilePreview] = useState(null);

      // Handle custom file upload with canvas compression
      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            // Compress on canvas to max 1000px
            const maxDim = 900;
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', 0.85);
            setFilePreview(compressed);
            setPhotoUrl(compressed);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

    // ====================================================================
    // COMPONENT: SlideshowModal (Presentation Mode with Confetti & Auto-play)
    // ====================================================================

    function SlideshowModal({ posts, boardTitle, onClose }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isAutoPlay, setIsAutoPlay] = useState(false);
      const [progress, setProgress] = useState(0);

      const post = posts[currentIndex] || posts[0];
      const color = NOTE_COLORS[post?.color_id] || NOTE_COLORS.lemon;
      const sticker = STICKERS.find(s => s.id === post?.sticker_id);

      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({ particleCount: 90, spread: 80, origin: { y: 0.6 } });
        }
      };

      const handleNext = useCallback(() => {
        setCurrentIndex(prev => (prev + 1) % posts.length);
        setProgress(0);
      }, [posts.length]);

      const handlePrev = useCallback(() => {
        setCurrentIndex(prev => (prev - 1 + posts.length) % posts.length);
        setProgress(0);
      }, [posts.length]);

      // Keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ') {
            handleNext();
          } else if (e.key === 'ArrowLeft') {
            handlePrev();
          } else if (e.key === 'Escape') {
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [handleNext, handlePrev, onClose]);

      // Auto-Play 4.5 seconds timer with progress bar
      useEffect(() => {
        if (!isAutoPlay) {
          setProgress(0);
          return;
        }

        const interval = 50; // update every 50ms
        const step = (interval / 4500) * 100;

        const timer = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              handleNext();
              return 0;
            }
            return prev + step;
          });
        }, interval);

        return () => clearInterval(timer);
      }, [isAutoPlay, handleNext]);

      if (!post) return null;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex flex-col justify-between text-white p-6 sm:p-10 select-none animate-fadeIn">
          
          {/* Top Bar: Title, Slide Index & Controls */}
          <div className="flex items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-bold text-amber-400 uppercase tracking-widest">Presentation Mode</span>
              <h2 className="text-xl sm:text-2xl font-bold truncate max-w-md">{boardTitle}</h2>
            </div>

            <div className="flex items-center gap-3">
              {/* Confetti Trigger */}
              <button
                onClick={triggerConfetti}
                className="px-3 py-1.5 rounded-lg bg-pink-600 hover:bg-pink-500 font-bold text-xs flex items-center gap-1 shadow-lg shadow-pink-600/30 transition"
              >
                <span>🎉 Confetti Burst</span>
              </button>

              {/* Auto Play Toggle */}
              <button
                onClick={() => setIsAutoPlay(!isAutoPlay)}
                className={`px-3 py-1.5 rounded-lg font-bold text-xs border transition flex items-center gap-1 ${
                  isAutoPlay
                    ? 'bg-amber-400 text-slate-950 border-amber-300'
                    : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                }`}
              >
                <span>{isAutoPlay ? '⏸️ Auto-Playing (4.5s)' : '▶️ Auto-Play'}</span>
              </button>

              {/* Close Button */}
              <button
                onClick={onClose}

    // ====================================================================
    // COMPONENT: SupabaseConfigModal (Connect Remote Supabase PostgreSQL)
    // ====================================================================

    function SupabaseConfigModal({ supabaseClient, onClose, onConnect, onDisconnect }) {
      const [url, setUrl] = useState(() => {
        try {
          const saved = localStorage.getItem('kudosboard_supabase_config');
          return saved ? (JSON.parse(saved).SUPABASE_URL || '') : (window.KUDOSBOARD_ENV?.SUPABASE_URL || '');
        } catch (e) { return ''; }
      });
      const [anonKey, setAnonKey] = useState(() => {
        try {
          const saved = localStorage.getItem('kudosboard_supabase_config');
          return saved ? (JSON.parse(saved).SUPABASE_ANON_KEY || '') : (window.KUDOSBOARD_ENV?.SUPABASE_ANON_KEY || '');
        } catch (e) { return ''; }
      });
      const [testing, setTesting] = useState(false);
      const [statusMsg, setStatusMsg] = useState(null);

      const handleTestAndConnect = async (e) => {
        e.preventDefault();
        if (!url.trim() || !anonKey.trim()) {
          setStatusMsg({ type: 'error', text: 'Please provide both your Supabase URL and Anon Key.' });
          return;
        }

        if (!window.supabase) {
          setStatusMsg({ type: 'error', text: 'Supabase JS library not loaded. Check internet connection.' });
          return;
        }

        setTesting(true);
        setStatusMsg({ type: 'info', text: 'Testing connection to Supabase PostgreSQL...' });

        try {
          const client = window.supabase.createClient(url.trim(), anonKey.trim());
          const { data, error } = await client.from('boards').select('id').limit(1);

          if (error && error.code === 'PGRST116') {
            setStatusMsg({
              type: 'warning',
              text: 'Connected to Supabase! However, the "boards" table was not found. Please execute the SQL migration script (supabase/migrations/001_init_kudos_schema.sql) in your Supabase SQL editor.'
            });
            onConnect(client, { SUPABASE_URL: url.trim(), SUPABASE_ANON_KEY: anonKey.trim() });
          } else if (error && error.message) {
            if (error.message.includes('relation "public.boards" does not exist')) {
              setStatusMsg({
                type: 'warning',
                text: 'Connected to Supabase! Please run the 001_init_kudos_schema.sql script in your Supabase SQL Editor to initialize the tables.'
              });
              onConnect(client, { SUPABASE_URL: url.trim(), SUPABASE_ANON_KEY: anonKey.trim() });
            } else {
              setStatusMsg({ type: 'error', text: 'Connection failed: ' + error.message });
            }
          } else {
            setStatusMsg({ type: 'success', text: 'Successfully connected to remote Supabase PostgreSQL database!' });
            setTimeout(() => {
              onConnect(client, { SUPABASE_URL: url.trim(), SUPABASE_ANON_KEY: anonKey.trim() });
            }, 600);
          }
        } catch (err) {
          setStatusMsg({ type: 'error', text: 'Connection failed: ' + err.message });
        } finally {
          setTesting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full shadow-2xl p-6 sm:p-8 border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2">
                <span className="text-3xl">⚡</span>
                <div>
                  <h3 className="text-xl font-extrabold text-slate-900">Supabase Database Connection</h3>
                  <p className="text-xs text-slate-500">Connect your live PostgreSQL database & Realtime WebSockets</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
            </div>

            {/* Connection Status Pill */}
            <div className={`p-3 rounded-xl mb-4 text-xs font-medium flex items-center justify-between ${
              supabaseClient ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-slate-50 text-slate-700 border border-slate-200'
            }`}>
              <div className="flex items-center gap-2">
                <span className="relative flex h-2.5 w-2.5">
                  <span className={`inline-flex h-full w-full rounded-full ${supabaseClient ? 'bg-emerald-500 animate-ping' : 'bg-slate-400'}`}></span>
                </span>
                <span>{supabaseClient ? 'Status: Connected to Supabase PostgreSQL' : 'Status: Using Local Realtime Engine (BroadcastChannel)'}</span>
              </div>
              {supabaseClient && (
                <button
                  onClick={onDisconnect}
                  className="text-rose-600 font-bold hover:underline"
                >
                  Disconnect
                </button>
              )}
            </div>

            {/* Form */}
            <form onSubmit={handleTestAndConnect} className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Supabase Project URL</label>
                <input
                  type="url"
                  required
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  placeholder="https://your-project-id.supabase.co"
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 font-mono text-xs focus:outline-none focus:border-amber-500 text-slate-900"
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Supabase Anon Public API Key</label>
                <input
                  type="password"
                  required
                  value={anonKey}
                  onChange={(e) => setAnonKey(e.target.value)}
                  placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 font-mono text-xs focus:outline-none focus:border-amber-500 text-slate-900"
                />
                <span className="text-[10px] text-slate-400 block mt-1">Found in: Supabase Dashboard → Project Settings → API → Project API Keys</span>
              </div>

              {statusMsg && (
                <div className={`p-3 rounded-xl text-xs font-medium ${
                  statusMsg.type === 'error' ? 'bg-rose-50 text-rose-800 border border-rose-200' :
                  statusMsg.type === 'warning' ? 'bg-amber-50 text-amber-800 border border-amber-200' :
                  statusMsg.type === 'success' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' :
                  'bg-blue-50 text-blue-800 border border-blue-200'
                }`}>
                  {statusMsg.text}
                </div>
              )}

              {/* Instructions Callout */}
              <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-600 space-y-1.5 text-[11px]">
                <div className="font-bold text-slate-800 text-xs">📋 Setup Checklist:</div>
                <div>1. In Supabase Dashboard, go to <b>SQL Editor</b>.</div>
                <div>2. Run <code>supabase/migrations/001_init_kudos_schema.sql</code> to create all 4 tables with RLS and Realtime.</div>
                <div>3. Paste your URL and Anon Key above and click <b>Connect</b>.</div>
              </div>

              <div className="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-lg text-slate-600 font-semibold"
                >
                  Close
                </button>
